<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agile Professional - Mock Exam</title>
<style>
  :root {
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --success: #16a34a;
    --danger: #dc2626;
    --bg: #f8fafc;
    --surface: #ffffff;
    --border: #e2e8f0;
    --text-main: #0f172a;
    --text-muted: #64748b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color: var(--bg);
    color: var(--text-main);
    line-height: 1.5;
    padding: 24px 16px;
  }
  .container { max-width: 840px; margin: 0 auto; }
  
  /* Sticky Header */
  .header {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 24px;
    margin-bottom: 24px;
    box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
    position: sticky;
    top: 12px;
    z-index: 50;
  }
  .header-flex { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
  .title-area h1 { font-size: 20px; font-weight: 700; color: var(--text-main); }
  .title-area p { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
  .timer-pill {
    background: #fef2f2;
    border: 1px solid #fecaca;
    color: var(--danger);
    font-weight: 700;
    font-size: 16px;
    padding: 6px 16px;
    border-radius: 9999px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .progress-bar-bg { background: var(--border); height: 6px; border-radius: 3px; margin-top: 16px; overflow: hidden; }
  .progress-fill { background: var(--primary); height: 100%; width: 0%; transition: width 0.2s ease; }

  /* Question Cards */
  .q-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 24px;
    margin-bottom: 16px;
    transition: border-color 0.2s;
  }
  .q-card.unanswered-alert { border-color: #f59e0b; background: #fffdf5; }
  .q-category { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--primary); margin-bottom: 6px; }
  .q-text { font-size: 16px; font-weight: 600; margin-bottom: 14px; }
  .options-group { display: flex; flex-direction: column; gap: 8px; }
  .option-label {
    display: flex;
    align-items: flex-start;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    transition: all 0.15s ease;
  }
  .option-label:hover { background-color: #f1f5f9; border-color: #cbd5e1; }
  .option-label input { margin-top: 3px; margin-right: 12px; accent-color: var(--primary); }
  .option-label.selected { background-color: #eff6ff; border-color: #93c5fd; font-weight: 500; }

  /* Post-Submission Review Styling */
  .review-mode .option-label.correct-choice { background: #dcfce7 !important; border-color: var(--success) !important; color: #14532d; font-weight: 600; }
  .review-mode .option-label.wrong-choice { background: #fee2e2 !important; border-color: var(--danger) !important; color: #7f1d1d; }
  .explanation-box { display: none; margin-top: 12px; padding: 12px; background: #f8fafc; border-left: 4px solid var(--primary); font-size: 13px; border-radius: 4px; }
  .review-mode .explanation-box { display: block; }

  /* Results Dashboard (Hidden until submit) */
  #results-panel {
    display: none;
    background: var(--surface);
    border: 2px solid var(--primary);
    border-radius: 16px;
    padding: 32px 24px;
    margin-bottom: 28px;
    box-shadow: 0 10px 15px -3px rgba(0,0,0,0.08);
  }
  .result-banner { text-align: center; margin-bottom: 24px; }
  .badge-status { display: inline-block; padding: 6px 18px; border-radius: 9999px; font-size: 14px; font-weight: 700; text-transform: uppercase; margin-bottom: 12px; }
  .badge-pass { background: #dcfce7; color: #15803d; }
  .badge-fail { background: #fee2e2; color: #b91c1c; }
  .score-number { font-size: 40px; font-weight: 800; line-height: 1; margin-bottom: 8px; }
  
  /* Domain Breakdown Table */
  .breakdown-table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 14px; }
  .breakdown-table th, .breakdown-table td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); }
  .breakdown-table th { background: #f1f5f9; font-weight: 600; color: var(--text-muted); }

  /* Footer Controls */
  .footer-actions { display: flex; gap: 12px; margin-top: 24px; margin-bottom: 60px; }
  button {
    cursor: pointer;
    border: none;
    border-radius: 8px;
    padding: 14px 24px;
    font-size: 15px;
    font-weight: 600;
    transition: opacity 0.2s;
  }
  button:hover { opacity: 0.9; }
  .btn-submit { background: var(--primary); color: white; flex: 2; }
  .btn-reset { background: #e2e8f0; color: var(--text-main); flex: 1; }
</style>
</head>
<body>

<div class="container">
  <!-- Sticky Header -->
  <header class="header">
    <div class="header-flex">
      <div class="title-area">
        <h1>Mock Assessment: Agile Foundation</h1>
        <p>30 Core Questions + 5 Bonus • Pass Target: 80% (24/30)</p>
      </div>
      <div class="timer-pill" id="timer-display">⏱ 45:00</div>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-fill" id="progress-indicator"></div>
    </div>
  </header>

  <!-- Final Results Panel (revealed on submit) -->
  <section id="results-panel">
    <div class="result-banner">
      <div id="status-pill" class="badge-status"></div>
      <div class="score-number" id="score-display">--</div>
      <p id="score-summary-text" style="color: var(--text-muted); font-size: 15px;"></p>
    </div>

    <h3 style="font-size: 16px; margin-top: 20px; margin-bottom: 8px;">Domain Performance Breakdown</h3>
    <table class="breakdown-table">
      <thead>
        <tr>
          <th>Knowledge Area</th>
          <th>Correct</th>
          <th>Accuracy</th>
        </tr>
      </thead>
      <tbody id="domain-table-body"></tbody>
    </table>

    <div style="text-align: center; margin-top: 24px;">
      <p style="font-size: 14px; color: var(--text-muted);">Scroll down to review the correct solutions and rationales for each item.</p>
    </div>
  </section>

  <!-- Quiz Form -->
  <form id="quiz-form"></form>

  <!-- Bottom Actions -->
  <div class="footer-actions">
    <button type="button" class="btn-submit" id="submit-btn" onclick="submitAssessment()">Submit & View Results</button>
    <button type="button" class="btn-reset" onclick="resetAssessment()">Reset Exam</button>
  </div>
</div>
  


<script>
const examData = [
  // Part 1: Agile Foundations (1-8)
  { cat: "Agile Foundations", q: "1. What is the primary goal of Agile?", o: ["Deliver comprehensive documentation", "Deliver customer value continuously", "Eliminate all project risks", "Reduce staffing costs"], a: 1, exp: "Agile focuses on delivering valuable increments to customers continuously, adapting to feedback rather than rigidly following plans." },
  { cat: "Agile Foundations", q: "2. Which Agile Manifesto value is correct?", o: ["Processes over people", "Documentation over working software", "Customer collaboration over contract negotiation", "Following a plan over responding to change"], a: 2, exp: "The Agile Manifesto explicitly prioritizes 'Customer collaboration over contract negotiation'." },
  { cat: "Agile Foundations", q: "3. Agile teams are expected to:", o: ["Wait for management approval for all decisions", "Be self-organizing and cross-functional", "Specialize in only one skill area", "Avoid customer interaction"], a: 1, exp: "Agile teams organize their own work and possess cross-functional disciplines to deliver increments end-to-end." },
  { cat: "Agile Foundations", q: "4. Which framework uses time-boxed iterations called Sprints?", o: ["Kanban", "Waterfall", "Scrum", "Lean"], a: 2, exp: "Scrum prescribes fixed-length iterations of 1-4 weeks known as Sprints." },
  { cat: "Agile Foundations", q: "5. What is an Agile Retrospective used for?", o: ["Budget planning", "Performance evaluation", "Continuous improvement", "Stakeholder reporting"], a: 2, exp: "Retrospectives are inspect-and-adapt checkpoints for the team to continuously improve ways of working." },
  { cat: "Agile Foundations", q: "6. Agile projects prioritize:", o: ["Fixed scope", "Fixed requirements", "Adaptability to change", "Long planning phases"], a: 2, exp: "Agile emphasizes responding to change over following a rigid, predetermined scope." },
  { cat: "Agile Foundations", q: "7. True or False: Agile teams deliver value incrementally.", o: ["True", "False"], a: 0, exp: "True. Work is delivered in smaller functional pieces rather than waiting for a single monolithic release." },
  { cat: "Agile Foundations", q: "8. Which Agile principle emphasizes delivering working solutions frequently?", o: ["Simplicity", "Technical excellence", "Frequent delivery of valuable products", "Centralized control"], a: 2, exp: "Principle 3 stresses delivering working software frequently, with a preference to the shorter timescale." },

  // Part 2: Kanban (9-13)
  { cat: "Kanban for Operations", q: "9. What is the purpose of a Kanban board?", o: ["Document project requirements", "Visualize work and workflow", "Store team metrics only", "Track budgets"], a: 1, exp: "Kanban boards make active work items and flow stages visible to prevent bottlenecks." },
  { cat: "Kanban for Operations", q: "10. What does WIP stand for?", o: ["Workflow Integration Process", "Work In Production", "Work In Progress", "Work Inspection Points"], a: 2, exp: "WIP stands for Work In Progress (items started but not yet completed)." },
  { cat: "Kanban for Operations", q: "11. Why are WIP limits important?", o: ["Increase multitasking", "Identify bottlenecks and improve flow", "Delay work intentionally", "Reduce visibility"], a: 1, exp: "WIP limits optimize throughput, curb context switching, and immediately highlight bottlenecks." },
  { cat: "Kanban for Operations", q: "12. A task stays in 'In Progress' for several days while others move quickly. What should the team do?", o: ["Ignore it until completion", "Identify the bottleneck and remove blockers", "Add more tasks", "Close the task"], a: 1, exp: "Agile teams swarm on blocked or aging items to resolve the impediment." },
  { cat: "Kanban for Operations", q: "13. True or False: Kanban requires fixed-length iterations.", o: ["True", "False"], a: 1, exp: "False. Kanban is a continuous flow system without mandatory time-boxed sprints." },

  // Part 3: Stakeholder Management (14-18)
  { cat: "Stakeholder Management", q: "14. Who is considered a stakeholder?", o: ["Only project sponsors", "Anyone affected by project outcomes", "Only project managers", "Only customers"], a: 1, exp: "Stakeholders include anyone who can affect or is affected by the initiative." },
  { cat: "Stakeholder Management", q: "15. High influence and high interest stakeholders should be:", o: ["Monitored minimally", "Managed closely", "Ignored until project completion", "Contacted only during issues"], a: 1, exp: "Under the power/interest grid, high power + high interest stakeholders must be managed closely." },
  { cat: "Stakeholder Management", q: "16. The primary purpose of stakeholder analysis is to:", o: ["Reduce project cost", "Understand stakeholder needs and influence", "Eliminate project risks", "Replace project governance"], a: 1, exp: "It maps expectations, influence, and engagement strategies across project actors." },
  { cat: "Stakeholder Management", q: "17. A stakeholder opposes a new process because they believe it will increase workload. What should you do first?", o: ["Escalate immediately", "Ignore concerns", "Understand their perspective and address concerns", "Continue implementation without discussion"], a: 2, exp: "Collaborative engagement begins with listening to root concerns and addressing perceived friction." },
  { cat: "Stakeholder Management", q: "18. True or False: Effective stakeholder engagement improves project success.", o: ["True", "False"], a: 0, exp: "True. Early and frequent collaboration prevents misalignment and change resistance." },

  // Part 4: BDD & Cucumber (19-22)
  { cat: "BDD & Cucumber", q: "19. What does BDD stand for?", o: ["Business Development Design", "Behavior-Driven Development", "Basic Development Delivery", "Build-Deploy-Debug"], a: 1, exp: "BDD stands for Behavior-Driven Development." },
  { cat: "BDD & Cucumber", q: "20. Which language is commonly used for Cucumber feature files?", o: ["XML", "JavaScript", "Gherkin", "SQL"], a: 2, exp: "Cucumber scenarios are written in Gherkin (Given, When, Then syntax)." },
  { cat: "BDD & Cucumber", q: "21. Which format is correct in a Cucumber scenario?", o: ["If / Then / When", "When / Then / Given", "Given / When / Then", "Test / Execute / Verify"], a: 2, exp: "Gherkin format follows Given (preconditions), When (action), Then (expected outcome)." },
  { cat: "BDD & Cucumber", q: "22. What is the benefit of BDD?", o: ["Eliminates testing needs", "Improves collaboration between business and technical teams", "Replaces Agile methodology", "Reduces stakeholder involvement"], a: 1, exp: "BDD builds a shared language between technical and non-technical stakeholders." },

  // Part 5: DevOps & CI/CD (23-26)
  { cat: "DevOps & CI/CD", q: "23. What is the primary objective of DevOps?", o: ["Separate development and operations responsibilities", "Improve collaboration and delivery speed", "Increase approval layers", "Eliminate automation"], a: 1, exp: "DevOps aligns development and operations to shorten lead time and increase delivery reliability." },
  { cat: "DevOps & CI/CD", q: "24. CI stands for:", o: ["Continuous Integration", "Continuous Inspection", "Centralized Integration", "Coordinated Implementation"], a: 0, exp: "CI stands for Continuous Integration (merging and automatically testing code frequently)." },
  { cat: "DevOps & CI/CD", q: "25. CD refers to:", o: ["Continuous Deployment/Delivery", "Central Development", "Code Duplication", "Configuration Design"], a: 0, exp: "CD refers to Continuous Delivery or Continuous Deployment." },
  { cat: "DevOps & CI/CD", q: "26. Which is a major DevOps benefit?", o: ["Longer release cycles", "Increased manual work", "Faster feedback and delivery", "Reduced collaboration"], a: 2, exp: "DevOps practices accelerate feedback loops and delivery speed via automation." },

  // Part 6: Agile Scaling & Mindset (27-30)
  { cat: "Scaling & Agile Mindset", q: "27. What challenge does Scaling Agile address?", o: ["Managing Agile across multiple teams", "Individual performance reviews", "Budget estimation only", "Vendor selection"], a: 0, exp: "Scaling frameworks coordinate dependencies, release trains, and portfolio goals across multiple teams." },
  { cat: "Scaling & Agile Mindset", q: "28. A strong Agile culture encourages:", o: ["Blame when failures occur", "Learning and continuous improvement", "Avoiding experimentation", "Limiting collaboration"], a: 1, exp: "Psychological safety, learning loops, and continuous improvement are foundational to an Agile culture." },
  { cat: "Scaling & Agile Mindset", q: "29. According to Agile Mindset & Culture, learning from failure means:", o: ["Accepting poor performance without action", "Identifying lessons to improve future outcomes", "Avoiding accountability", "Repeating the same approach"], a: 1, exp: "Failure is treated as empirical data to adjust and refine future deliverables." },
  { cat: "Scaling & Agile Mindset", q: "30. Scenario: A team delivered a feature that did not meet customer expectations. What is the most Agile response?", o: ["Blame the developer", "Freeze future changes", "Gather feedback, inspect results, and adapt", "Restart the project"], a: 2, exp: "Empirical process control relies on Transparency, Inspection, and Adaptation based on customer feedback." },

  // Bonus Questions (31-35)
  { cat: "Bonus Situational", q: "31. Your team is midway through a Sprint when a stakeholder requests a high-priority feature. What should happen first?", o: ["Add it immediately", "Evaluate impact with Product Owner and team", "Remove testing tasks", "Extend the Sprint"], a: 1, exp: "Mid-sprint scope changes must be assessed against the Sprint Goal with the Product Owner." },
  { cat: "Bonus Situational", q: "32. A Kanban board shows many items waiting for review. This indicates:", o: ["Team productivity is increasing", "A bottleneck exists in the review stage", "WIP limits are too high automatically", "Project completion is near"], a: 1, exp: "Accumulation in a queue stage confirms a capacity bottleneck in that downstream step." },
  { cat: "Bonus Situational", q: "33. DevOps culture is primarily built on:", o: ["Automation, collaboration, and continuous improvement", "Documentation and governance only", "Separate functional silos", "Release approvals"], a: 0, exp: "Culture, Automation, Measurement, and Sharing (CAMS) drive DevOps maturity." },
  { cat: "Bonus Situational", q: "34. The Agile mindset values experimentation because:", o: ["Every experiment succeeds", "Innovation comes through validated learning", "It eliminates risk entirely", "It prevents customer feedback"], a: 1, exp: "Small, fast-feedback experiments generate validated learning with low financial waste." },
  { cat: "Bonus Situational", q: "35. During a retrospective, the team identifies recurring testing delays. What should be the outcome?", o: ["Record it and move on", "Assign blame", "Create improvement actions for the next iteration", "Stop retrospectives"], a: 2, exp: "Retrospectives must culminate in tangible, assigned action items incorporated into future sprints." }
];

// Initialize Quiz
function buildQuiz() {
  const container = document.getElementById("quiz-form");
  container.innerHTML = examData.map((item, idx) => `
    <div class="q-card" id="qcard-${idx}">
      <div class="q-category">${item.cat} • Question ${idx + 1} of ${examData.length}</div>
      <div class="q-text">${item.q}</div>
      <div class="options-group">
        ${item.o.map((opt, optIdx) => `
          <label class="option-label" id="opt-label-${idx}-${optIdx}">
            <input type="radio" name="q-${idx}" value="${optIdx}" onchange="onSelectOption(${idx}, this)">
            <span>${opt}</span>
          </label>
        `).join("")}
      </div>
      <div class="explanation-box" id="exp-${idx}">
        <strong>Rationale:</strong> ${item.exp}
      </div>
    </div>
  `).join("");
}

function onSelectOption(qIndex, inputElem) {
  // Update styling
  const labels = document.querySelectorAll(`[id^='opt-label-${qIndex}-']`);
  labels.forEach(l => l.classList.remove("selected"));
  inputElem.closest(".option-label").classList.add("selected");
  document.getElementById(`qcard-${qIndex}`).classList.remove("unanswered-alert");
  updateProgress();
}

function updateProgress() {
  const answered = document.querySelectorAll("input[type='radio']:checked").length;
  const pct = Math.round((answered / examData.length) * 100);
  document.getElementById("progress-indicator").style.width = pct + "%";
}

  const answeredCount = document.querySelectorAll("input[type='radio']:checked").length;
  if (answeredCount < examData.length) {

  const name = document.getElementById("user-name").value.trim();
  const email = document.getElementById("user-email").value.trim();

  if (!name || !email) {
    alert("Please enter your name and email before submitting.");
    return;
  }

  // ... (Your grading logic from earlier) ...
  const coreScore = /* calculated score (0-30) */;
  const totalScore = /* total score (0-35) */;
  const percentage = Math.round((coreScore / 30) * 100);
  const status = coreScore >= 24 ? "PASSED" : "FAILED";

  // Build the payload
  const payload = {
    timestamp: new Date().toISOString(),
    fullName: name,
    email: email,
    coreScore: coreScore,
    totalScore: totalScore,
    percentage: percentage,
    status: status

  // Dispatch to your Excel endpoint

    if (!confirm(`You have only answered ${answeredCount} of ${examData.length} questions. Do you still want to finalize and grade the exam?`)) {
     return;
      
    }
  }

  // Freeze inputs
  document.querySelectorAll("input[type='radio']").forEach(r => r.disabled = true);
  document.getElementById("submit-btn").disabled = true;
  document.getElementById("submit-btn").style.opacity = "0.5";
  document.body.classList.add("review-mode");

  let coreScore = 0;
  let totalScore = 0;
  const domainStats = {};

  examData.forEach((item, idx) => {
    if (!domainStats[item.cat]) {
      domainStats[item.cat] = { total: 0, correct: 0 };
    }
    domainStats[item.cat].total++;

    const selected = document.querySelector(`input[name="q-${idx}"]:checked`);
    const correctLabel = document.getElementById(`opt-label-${idx}-${item.a}`);
    
    // Always mark the correct solution in review
    correctLabel.classList.add("correct-choice");

    if (selected) {
      const selectedVal = parseInt(selected.value, 10);
      if (selectedVal === item.a) {
        if (idx < 30) coreScore++;
        totalScore++;
        domainStats[item.cat].correct++;
      } else {
        document.getElementById(`opt-label-${idx}-${selectedVal}`).classList.add("wrong-choice");
      }
    }
  });

  // Calculate Results
  const corePercentage = Math.round((coreScore / 30) * 100);
  const passed = coreScore >= 24;

  const panel = document.getElementById("results-panel");
  const statusPill = document.getElementById("status-pill");
  const scoreDisplay = document.getElementById("score-display");
  const summaryText = document.getElementById("score-summary-text");

  statusPill.className = "badge-status " + (passed ? "badge-pass" : "badge-fail");
  statusPill.innerText = passed ? "Pass • Credential Benchmark Met" : "Did Not Meet Benchmark (Target: 80%)";

  scoreDisplay.innerText = `${coreScore} / 30 (${corePercentage}%)`;
  summaryText.innerText = `Total Score across all 35 items: ${totalScore}/35 (${Math.round((totalScore/35)*100)}%). Benchmark criteria requires 24/30 on Core Questions 1–30.`;

  // Domain Breakdown
  const tableBody = document.getElementById("domain-table-body");
  tableBody.innerHTML = Object.keys(domainStats).map(cat => {
    const stats = domainStats[cat];
    const pct = Math.round((stats.correct / stats.total) * 100);
    const color = pct >= 80 ? "color: var(--success); font-weight:700;" : (pct < 60 ? "color: var(--danger); font-weight:700;" : "font-weight:600;");
    return `
      <tr>
        <td><strong>${cat}</strong></td>
        <td>${stats.correct} / ${stats.total}</td>
        <td style="${color}">${pct}%</td>
      </tr>
    `;
  }).join("");

  panel.style.display = "block";
  panel.scrollIntoView({ behavior: "smooth" });
}

function resetAssessment() {
  if (!confirm("Are you sure you want to reset the assessment? All selections will be erased.")) return;
  document.getElementById("quiz-form").reset();
  document.body.classList.remove("review-mode");
  document.getElementById("results-panel").style.display = "none";
  document.querySelectorAll(".option-label").forEach(l => l.classList.remove("selected", "correct-choice", "wrong-choice"));
  document.querySelectorAll("input[type='radio']").forEach(r => r.disabled = false);
  document.getElementById("submit-btn").disabled = false;
  document.getElementById("submit-btn").style.opacity = "1";
  document.getElementById("progress-indicator").style.width = "0%";
  window.scrollTo({ top: 0, behavior: "smooth" });
}

// 45-Minute Timer
let duration = 45 * 60;
const timerEl = document.getElementById("timer-display");
const timerInterval = setInterval(() => {
  if (duration <= 0) {
    clearInterval(timerInterval);
    timerEl.innerText = "⏱ Time Expired";
    alert("Time has reached the 45-minute limit! Submitting your answers now.");
    submitAssessment();
    return;
  }
  duration--;
  const mins = Math.floor(duration / 60);
  const secs = duration % 60;
  timerEl.innerText = `⏱ ${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
}, 1000);

buildQuiz();
</script>
</body>
</html>
